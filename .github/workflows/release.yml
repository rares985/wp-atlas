name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Create plugin zip
        run: |
          mkdir wp-atlas
          cp wp-atlas.php wp-atlas/
          cp -r build wp-atlas/
          cp -r includes wp-atlas/
          zip -r wp-atlas.zip wp-atlas/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wp-atlas.zip
          generate_release_notes: true
